<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title> Liên hệ - Tập Đoàn Bảo Vệ Hoàng Anh Đạt</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div th:replace="layout/user/header :: header"></div>
    <section class="contact-section py-5">
      <div class="container">
        <h2 class="text-center mb-4 fw-bold">THÔNG TIN LIÊN HỆ</h2>
        <div class="row">
          <div class="col-md-6">
            <h6><strong>Công ty TNHH bảo vệ Hoàng Anh Đạt</strong></h6>
            <p>
              Địa chỉ: 140-142 Đường Nguyễn Du, P. Nông Trang, TP Việt Trì, Phú Thọ
            </p>
            <p>Điện thoại:<strong> 0989.383.222</strong></p>
            <p>Tel: <strong>0210.6.333.222</strong>
            <iframe src="https://www.google.com/maps?q=140+Nguyễn+Du,+Việt+Trì,+Phú+Thọ&output=embed"
                width="100%"
                height="300"
                style="border: 0"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
          </div>

          <div class="col-md-6">
            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <form method="post" th:action="@{/contact/send}">
              <div class="mb-3">
                <input type="text" name="fullName" class="form-control" placeholder="Họ và tên" required/>
              </div>
              <div class="mb-3">
                <input type="email" name="email" class="form-control" placeholder="Email đầy đủ" required/>
              </div>
              <div class="mb-3">
                <input type="text" name="subject" class="form-control" placeholder="Tiêu đề" required/>
              </div>
              <div class="mb-3">
                <textarea name="message" class="form-control" rows="5" placeholder="Viết lời nhắn" required></textarea>
              </div>
              <button type="submit" class="btn btn-outline-dark">GỬI THÔNG TIN</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <section class="partners-section py-5 bg-light">
      <h2 class="text-center mb-4 fw-bold text-primary">ĐỐI TÁC CỦA CHÚNG TÔI</h2>
      <div class="container">
        <div class="d-flex justify-content-around align-items-center">
          <img src="/images/doitac/ab.jpg" class="partner-logo" alt="VICEM SÔNG THAO"/>
          <img src="/images/doitac/Logo_v2_của_PV_Oil.png" class="partner-logo" alt="PV_Oil"/>
          <img src="/images/doitac/logo-lts-jsc.png" class="partner-logo" alt="lts-jsc"/>
          <img src="/images/doitac/logo-shinsungvina.png" class="partner-logo" alt="logo-shinsungvina.png" />
        </div>
      </div>
    </section>
        <div th:replace="layout/user/footer :: footer"></div>
  </body>
</html>
<style>
body {
  font-family: Arial, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  color: #222;
  background-color: #fff;
  margin: 0;
  padding: 0;
}

.contact-section {
  background-color: #fff;
}

.contact-section h2 {
  font-size: 26px;
  color: #333;
  position: relative;
  margin-bottom: 30px;
}

.contact-section h2::after {
  content: "";
  display: block;
  width: 60px;
  height: 3px;
  background-color: #8c4a00;
  margin: 10px auto 0;
}

.contact-section p {
  margin: 5px 0;
}

.contact-section .form-control {
  border-radius: 0;
  border: 1px solid #ccc;
  padding: 10px 12px;
  font-size: 15px;
}

.contact-section .form-control:focus {
  box-shadow: none;
  border-color: #999;
}

.contact-section textarea {
  resize: vertical;
}

.contact-section button {
  border-radius: 20px;
  padding: 10px 30px;
  font-weight: bold;
  transition: all 0.3s ease;
}

.contact-section button:hover {
  background-color: #000;
  color: #fff;
}

.partners-section {
  background-color: #f8f8f8;
  padding: 50px 0;
}

.partners-section h2 {
  color: #003366;
  font-size: 24px;
  margin-bottom: 1.5rem;
}

.partners-section h2::after {
  content: "";
  display: block;
  width: 50px;
  height: 3px;
  background-color: #8c4a00;
  margin: 10px auto 0;
}

.partners-section .shadow-sm {
  border: 1px solid #ddd;
  padding: 25px;
  border-radius: 6px;
  background-color: #fff;
}

.partners-section img {
  height: 100px;
  border-radius: 6px;
}

.partners-section .info-text {
  font-size: 15px;
  margin-left: 20px;
}

.partners-section .info-text p {
  margin: 4px 0;
}

.partners-section a {
  color: #000;
  text-decoration: none;
}

.partners-section a:hover {
  text-decoration: underline;
}
</style>
