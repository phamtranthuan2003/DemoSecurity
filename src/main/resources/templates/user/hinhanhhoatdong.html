<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Hình Ảnh Hoạt Động - CÔNG TY TNHH DỊCH VỤ BẢO VỆ CHUYÊN NGHIỆP HOÀNG ANH ĐẠT</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div th:replace="layout/user/header :: header"></div>
  <div class="main-wrapper my-5">
    <div class="row">
      <div class="col-md-8">
        <h4 class="mb-4 fw-bold text-uppercase">Hình ảnh hoạt động</h4>
        <div class="text-center mb-4">
          <img id="mainImage" src="/images/hinhanhhoatdong/46.jpg" class="img-fluid main-image shadow" alt="Hình ảnh hoạt động chính" />
        </div>
        <div class="gallery-thumbnails d-flex flex-wrap justify-content-start">
          <img src="/images/hinhanhhoatdong/45.jpg" onclick="changeImage(this.src)" />
          <img src="/images/hinhanhhoatdong/44.jpg" onclick="changeImage(this.src)" />
          <img src="/images/hinhanhhoatdong/40.jpg" onclick="changeImage(this.src)" />
          <img src="/images/hinhanhhoatdong/14.jpg" onclick="changeImage(this.src)" />
          <img src="/images/hinhanhhoatdong/42.jpg" onclick="changeImage(this.src)" />
          <img src="/images/hinhanhhoatdong/28.jpg" onclick="changeImage(this.src)" />
        </div>
      </div>
    </div>
  </div>
  <div th:replace="layout/user/footer :: footer"></div>
</body>
</html>
<script>
  function changeImage(src) {
    document.getElementById("mainImage").src = src;
  }
</script>
<style>
  .main-wrapper {
    width: 90%;
    max-width: 1000px;
    margin: 0 auto;
  }

  .main-image {
    width: 100%;
    max-height: 450px;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  }

  .gallery-thumbnails {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .gallery-thumbnails img {
    height: 70px;
    width: 100px;
    object-fit: cover;
    cursor: pointer;
    border: 2px solid transparent;
    border-radius: 5px;
    transition: border-color 0.2s, transform 0.2s;
  }

  .gallery-thumbnails img:hover {
    border-color: #007bff;
    transform: scale(1.05);
  }

  @media (max-width: 768px) {
    .main-image {
      max-height: 300px;
    }

    .gallery-thumbnails img {
      height: 60px;
      width: 90px;
    }
  }
</style>
