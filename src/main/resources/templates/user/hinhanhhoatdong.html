<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Hình Ảnh Hoạt Động - Công ty TNHH Bảo vệ Hoàng Anh Đạt</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div th:replace="layout/user/header :: header"></div>
  <div class="main-wrapper my-5">
    <div class="row">
      <div class="col-md-8">
        <h4 class="mb-4 fw-bold text-uppercase">Hình ảnh hoạt động</h4>
        <div class="text-center mb-4">
          <img id="mainImage" src="/images/gallery1.jpg" class="img-fluid main-image shadow" alt="Hình ảnh hoạt động chính" />
        </div>
        <div class="gallery-thumbnails d-flex flex-wrap justify-content-start">
          <img src="/images/gallery1.jpg" onclick="changeImage(this.src)" />
          <img src="/images/gallery2.jpg" onclick="changeImage(this.src)" />
          <img src="/images/gallery3.jpg" onclick="changeImage(this.src)" />
          <img src="/images/gallery4.jpg" onclick="changeImage(this.src)" />
          <img src="/images/gallery5.jpg" onclick="changeImage(this.src)" />
          <img src="/images/gallery6.jpg" onclick="changeImage(this.src)" />
          <img src="/images/gallery7.jpg" onclick="changeImage(this.src)" />
        </div>
      </div>
      <div class="col-md-4">
        <h5 class="fw-bold border-bottom pb-2">Hoạt động nổi bật</h5>
        <div class="mb-3">
          <img src="/images/hoat-dong-1.jpg" class="sidebar-img" alt="Hoạt động 1" />
          <p class="mb-1">Tết nhân ái – Hoàng Anh Đạt sẻ chia yêu thương</p>
        </div>
        <div class="mb-3">
          <img src="/images/hoat-dong-2.jpg" class="sidebar-img" alt="Hoạt động 2" />
          <p class="mb-1">PCCC định kỳ tại GO! Đà Nẵng</p>
        </div>
        <div class="mb-3">
          <img src="/images/hoat-dong-3.jpg" class="sidebar-img" alt="Hoạt động 3" />
          <p class="mb-1">Tập huấn nghiệp vụ tại Vincom Hải Phòng</p>
        </div>
      </div>
    </div>
  </div>
  <div th:replace="layout/user/footer :: footer"></div>
</body>
</html>
<script>
  function changeImage(src) {
    document.getElementById("mainImage").src = src;
  }
</script>
<style>
  .main-wrapper {
    width: 80%;
    margin: 0 auto;
  }
  .gallery-thumbnails img {
    height: 70px;
    object-fit: cover;
    margin: 5px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .gallery-thumbnails img:hover {
    border-color: #007bff;
  }
  .main-image {
    max-height: 400px;
    object-fit: cover;
    border-radius: 5px;
  }
  .sidebar-img {
    width: 100%;
    max-height: 100px;
    object-fit: cover;
    margin-bottom: 10px;
  }
</style>
