<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${blog.title}">Chi tiết bài viết</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <div th:replace="layout/user/header :: header"></div>
    
    <div class="main-wrapper my-5">
      <div class="row">
        <div class="col-md-12">
          <div class="text-center">
            <h1 class="fw-bold mb-3" th:text="${blog.title}">Tiêu đề bài viết</h1><br>
            <h2  th:text="${blog.author}" >Tên tác giả</h2>
            <p class="text-muted mb-4" th:text="|Ngày đăng: ${#temporals.format(blog.createdAt, 'dd/MM/yyyy')}|"></p>
          </div><br><br>
          <div class="blog-content" th:utext="${blog.content}">
          </div>
        </div>
      </div>
    </div>
    <div th:replace="layout/user/footer :: footer"></div>
  </body>
</html>

<style>
  .main-wrapper {
    width: 90%;
    max-width: 1200px;
    margin: 0 auto;
  }

  .blog-img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    margin-bottom: 20px;
  }

  .blog-content {
  max-width: 80%;
  margin: 0 auto;
  text-align: justify;
}

.blog-content p,
.blog-content img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 20px auto;
  border-radius: 6px;
}
</style>
