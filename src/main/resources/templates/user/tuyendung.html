<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Tuyển Dụng - Công ty TNHH Bảo vệ Hoàng Anh Đạt</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .main-wrapper {
      width: 80%;
      margin: 0 auto;
    }
    .news-img {
      width: 100%;
      height: auto;
      max-height: 160px;
      object-fit: cover;
    }
    .recruit-item {
      border-bottom: 1px solid #ddd;
      padding-bottom: 20px;
      margin-bottom: 20px;
    }
    .sidebar-img {
      width: 100%;
      max-height: 100px;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .read-more {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div th:replace="layout/user/header :: header"></div>

  <div class="main-wrapper my-5">
    <div class="row">
      <div class="col-md-8">
        <h4 class="mb-4 fw-bold text-uppercase border-bottom pb-2">Tuyển dụng</h4>

        <div class="recruit-item row">
          <div class="col-md-4">
            <img src="/images/tuyen-dung-1.jpg" class="news-img" alt="Tuyển dụng nhân viên bảo vệ" />
          </div>
          <div class="col-md-8">
            <h5 class="fw-semibold">Tuyển dụng nhân viên bảo vệ tại Yên Bái</h5>
            <p class="text-muted mb-1">Ngày đăng: 01/07/2025</p>
            <p class="read-more"><a href="#" class="btn btn-danger btn-sm">Xem thêm</a></p>
          </div>
        </div>

      </div>

      <!-- Hoạt động nổi bật -->
      <div class="col-md-4">
        <h5 class="fw-bold border-bottom pb-2">Hoạt động nổi bật</h5>
        <div class="mb-3">
          <img src="/images/hoat-dong-1.jpg" class="sidebar-img" alt="Hoạt động 1" />
          <p class="mb-1">Tết nhân ái – Hoàng Anh Đạt sẻ chia yêu thương</p>
        </div>
        <div class="mb-3">
          <img src="/images/hoat-dong-2.jpg" class="sidebar-img" alt="Hoạt động 2" />
          <p class="mb-1">PCCC định kỳ tại GO! Đà Nẵng</p>
        </div>
        <div class="mb-3">
          <img src="/images/hoat-dong-3.jpg" class="sidebar-img" alt="Hoạt động 3" />
          <p class="mb-1">Tập huấn nghiệp vụ tại Vincom Hải Phòng</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div th:replace="layout/user/footer :: footer"></div>
</body>
</html>
