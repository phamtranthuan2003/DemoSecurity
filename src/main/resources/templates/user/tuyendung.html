<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Tuyển Dụng - CÔNG TY TNHH DỊCH VỤ BẢO VỆ CHUYÊN NGHIỆP HOÀNG ANH ĐẠT</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <div th:replace="layout/user/header :: header"></div>
    
    <div class="main-wrapper my-5">
      <div class="row">
        <div class="col-md-8">
          <h4 class="mb-4 fw-bold text-uppercase border-bottom pb-2">Tuyển dụng</h4>
          <div th:each="blog : ${blogs}" class="recruit-item row">
            <div class="col-md-4">
              <img th:src="${blog.image}" class="news-img" alt="Ảnh tuyển dụng" />
            </div>
            <div class="col-md-8 recruit-content">
              <h5 class="fw-semibold" th:text="${blog.title}">Blog Title</h5>
              <p class="text-muted mb-1" th:text="|Ngày đăng: ${#temporals.format(blog.createdAt, 'dd/MM/yyyy')}|"></p>
              <div class="blog-content" th:utext="${blog.content}"> 
              </div><br>
              <p class="read-more">
                <a th:href="@{'/blog/' + ${blog.id}}" class="btn btn-danger btn-sm">Xem thêm</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div th:replace="layout/user/footer :: footer"></div>
  </body>
</html>

<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f5f6f8;
    color: #333;
  }

  .main-wrapper {
    width: 90%;
    max-width: 1200px;
    margin: 0 auto;
  }


  .recruit-item {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    padding: 20px;
    margin-bottom: 30px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .recruit-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
  }

  .news-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
    transition: transform 0.3s ease;
  }

  .news-img:hover {
    transform: scale(1.02);
  }

  .recruit-content {
    padding-left: 15px;
  }

  .recruit-content h5 {
    color: #2c3e50;
    font-size: 1.2rem;
    margin-bottom: 8px;
  }

  .recruit-content p {
    font-size: 0.95rem;
    color: #666;
  }

  .read-more a {
    display: inline-block;
    font-size: 0.9rem;
    padding: 6px 14px;
    border-radius: 6px;
    background-color: #dc3545;
    color: white;
    text-decoration: none;
    font-weight: 500;
    transition: background-color 0.2s;
  }

  .read-more a:hover {
    background-color: #b02a37;
  }

  .blog-content {
    display: -webkit-box;
    -webkit-line-clamp: 2; /* Hiển thị 2 dòng rồi cắt */
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 0.95rem;
    margin-bottom: 8px;
  }

  @media (max-width: 768px) {
    .recruit-item {
      flex-direction: column;
    }

    .recruit-content {
      padding-left: 0;
      margin-top: 10px;
    }
  }
</style>
