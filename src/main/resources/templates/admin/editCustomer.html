<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="mb-4 text-center">📝 Chỉnh sửa tài khoản quản trị</h2>
        <form th:action="@{/admin/editCustomer/{id}(id=${customer.id})}" th:object="${customer}" method="post">
            <div class="mb-3">
                <label for="name" class="form-label">Họ tên</label>
                <input type="text" class="form-control" id="username" name="username" required th:value="${customer.username}">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Địa chỉ Email</label>
                <input type="email" class="form-control" id="email" name="email" required th:value="${customer.email}">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" id="password" name="password" required
                       th:value="${customer.password}" minlength="6">
            </div>

            <div class="mb-3">
                <label for="re-password" class="form-label">Nhập lại mật khẩu:</label>
                <input type="password" class="form-control" id="re-password" name="rePassword" required
                       th:value="${customer.password}">
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Số điện thoại</label>
                <input type="text" class="form-control" id="phone" name="phone" required th:value="${customer.phone}">
            </div>

            <button type="submit" class="btn btn-primary w-100">Sửa người dùng</button>
        </form>

        <p class="mt-3 text-center">
        </p>
    </div>
</body>

</html>
