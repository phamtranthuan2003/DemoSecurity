<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạo Dịch Vụ Mới</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.ckeditor.com/ckeditor5/41.0.0/classic/ckeditor.js"></script>
</head>

<body>
    
    <div class="form-container">
        <div class="form-title">Thêm Dịch Vụ Mới</div>
        <form th:action="@{/admin/services/save}" method="post" enctype="multipart/form-data">
            <div class="mb-4">
                <label for="title" class="form-label">Tiêu đề Dịch Vụ</label>
                <input type="text" class="form-control" id="title" name="title" placeholder="Nhập tiêu đề" required>
            </div>
            <div class="mb-4">
                <label for="image" class="form-label">Ảnh đại diện Dịch Vụ</label>
                <input type="file" class="form-control" id="image" name="image" accept="image/*" required>
            </div>
            <div class="mb-4">
                <label for="content" class="form-label">Nội dung (có thể chèn ảnh)</label>
                <textarea id="editor" name="content"></textarea>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/admin/blogsList}" class="btn btn-secondary">Hủy</a>
                <button type="submit" class="btn btn-primary">Đăng bài</button>
            </div>
        </form>
    </div>
</body>
</html>
<script>
    ClassicEditor
    .create(document.querySelector('#editor'), {
        ckfinder: {
            uploadUrl: '/admin/services/upload-image'
        },
        toolbar: [
        'undo', 'redo', '|',
        'heading', '|',
        'bold', 'italic', 'link', '|',
        'handleEditorImageUpload', 'insertTable', 'mediaEmbed', '|',
        'bulletedList', 'numberedList', 'blockQuote'
        ],
        image: {
            toolbar: ['imageTextAlternative', 'imageStyle:full', 'imageStyle:side']
        }
    })
    .catch(error => {
        console.error(error);
    });
</script>
<style>
    body {
        background-color: #f5f7fa;
        font-family: 'Segoe UI', sans-serif;
    }

    .form-container {
        max-width: 800px;
        margin: 60px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        padding: 40px;
    }

    .form-title {
        font-size: 26px;
        font-weight: 600;
        margin-bottom: 30px;
        color: #333;
        text-align: center;
    }

    label {
        font-weight: 500;
        margin-bottom: 6px;
    }

    .form-control, #editor {
        border-radius: 8px;
    }

    .btn {
        border-radius: 8px;
        padding: 10px 18px;
        font-weight: 500;
    }

    .btn-primary:hover {
        background-color: #0d6efdcc;
    }

    .btn-secondary {
        background-color: #6c757d;
        border: none;
    }

    .btn-secondary:hover {
        background-color: #5a6268;
    }
</style>
