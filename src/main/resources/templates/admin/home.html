<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard - Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <style>
    html, body {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f6f9;
      margin: 0;
    }

    .wrapper {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      height: 100vh;
      width: 250px;
      background: linear-gradient(to bottom, #1e2a38, #2c3e50);
      color: #ecf0f1;
      padding-top: 1.5rem;
      flex-shrink: 0;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.08);
    }

    .sidebar h4 {
      text-align: center;
      margin-bottom: 2rem;
      font-weight: bold;
      font-size: 20px;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .nav-link {
      color: #bdc3c7;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      font-size: 15px;
      transition: all 0.3s ease;
      border-left: 4px solid transparent;
    }

    .nav-link:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border-left: 4px solid #20c997;
    }

    .nav-link.active {
      background-color: #20c997;
      color: #ffffff;
      font-weight: 600;
      border-left: 4px solid #ffffff;
    }

    .main-content {
      flex-grow: 1;
      padding: 40px;
      background-color: #f4f6f9;
    }

    .main-content h2 {
      font-weight: 600;
      font-size: 26px;
      margin-bottom: 15px;
    }

    .main-content p {
      font-size: 16px;
      color: #555;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #f8f9fa;
      color: #888;
      font-size: 14px;
      border-top: 1px solid #ddd;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <!-- SIDEBAR -->
    <div th:replace="layout/admin/header :: header"></div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      <h2><i class="bi bi-speedometer2 me-2"></i>Trang quản trị</h2>
      <p>Chào mừng bạn đến với giao diện quản trị!</p>
    </div>
  </div>
</body>
</html>
