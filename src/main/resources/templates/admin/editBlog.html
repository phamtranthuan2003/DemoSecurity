<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa bài viết</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.ckeditor.com/ckeditor5/41.0.0/classic/ckeditor.js"></script>

    <style>
        body {
            background-color: #f5f7fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .form-container {
            max-width: 800px;
            margin: 60px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            padding: 40px;
        }

        .form-title {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #333;
            text-align: center;
        }

        label {
            font-weight: 500;
            margin-bottom: 6px;
        }

        .form-control, #editor {
            border-radius: 8px;
        }

        .btn {
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 500;
        }

        .btn-primary:hover {
            background-color: #0d6efdcc;
        }

        .btn-secondary {
            background-color: #6c757d;
            border: none;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        /* Đảm bảo ảnh không bị quá to trong vùng soạn thảo */
        .ck-editor__editable img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 12px 0;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="form-title">Chỉnh sửa Bài Viết</div>

    <form th:action="@{/admin/blogs/update}" th:object="${blog}" method="post" enctype="multipart/form-data">
    <input type="hidden" th:field="*{id}" />

    <div class="mb-4">
        <label for="title" class="form-label">Tiêu đề bài viết</label>
        <input type="text" class="form-control" id="title" th:field="*{title}" placeholder="Nhập tiêu đề" required>
    </div>
    <div class="mb-4" th:if="${blog.image != null}">
        <label class="form-label">Ảnh hiện tại</label><br>
        <img th:src="@{${blog.image}}" alt="Ảnh đại diện" style="max-width: 200px; border-radius: 8px;">
    </div>

    <div class="mb-4">
        <label for="imageFile" class="form-label">Thay ảnh đại diện (nếu muốn)</label>
        <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*">
    </div>

    <div class="mb-4">
        <label for="content" class="form-label">Nội dung (có thể chèn ảnh)</label>
        <textarea id="editor" name="content" th:text="*{content}"></textarea>
    </div>

    <div class="mb-4">
        <label for="author" class="form-label">Tác giả</label>
        <input type="text" class="form-control" id="author" th:field="*{author}" placeholder="Tên người viết" required>
    </div>

    

    <div class="d-flex justify-content-end gap-2">
        <a th:href="@{/admin/blogsList}" class="btn btn-secondary">Hủy</a>
        <button type="submit" class="btn btn-primary">Cập nhật</button>
    </div>
</form>

</div>

<script>
    ClassicEditor
        .create(document.querySelector('#editor'), {
            ckfinder: {
                uploadUrl: '/admin/blogs/upload-image'
            },
            toolbar: [
                'undo', 'redo', '|',
                'heading', '|',
                'bold', 'italic', 'link', '|',
                'uploadImage', 'insertTable', 'mediaEmbed', '|',
                'bulletedList', 'numberedList', 'blockQuote'
            ],
            image: {
                resizeUnit: '%',
                resizeOptions: [
                    {
                        name: 'resizeImage:original',
                        label: '100%',
                        value: null
                    },
                    {
                        name: 'resizeImage:75',
                        label: '75%',
                        value: '75'
                    },
                    {
                        name: 'resizeImage:50',
                        label: '50%',
                        value: '50'
                    }
                ],
                toolbar: [
                    'imageTextAlternative',
                    '|',
                    'imageStyle:full',
                    'imageStyle:side',
                    '|',
                    'resizeImage'
                ]
            }
        })
        .catch(error => {
            console.error(error);
        });
</script>

</body>
</html>
